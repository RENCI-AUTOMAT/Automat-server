name: 'Release a new docker image to Github Packages Container registry.'

on:
    release:
        types: [published]

env:
    REGISTRY: ghcr.io

jobs:
    push_to_registry:
        name: Push Docker image to GitHub Packages tagged with "latest" and version number.
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Get the version
              id: get_version
              run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
            - name: Extract metadata (tags, labels) for Docker
              id: meta_automat_image
              uses: docker/metadata-action@v5
              with:
                images:
                    ghcr.io/${{ github.repository }}
            - name: Login to ghcr
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push base image
              uses: docker/build-push-action@v5
              with:
                  context: ./Automat/
                  push: true
                  tags: ${{ steps.meta_automat_image.outputs.tags }}
                  labels: ${{ steps.meta_automat_image.outputs.labels }}
                  build-args: VERSION=${{ steps.get_version.outputs.VERSION }}
